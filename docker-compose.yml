services:
  db:
    image: postgres:16-alpine
    container_name: trendpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trendpulse
      POSTGRES_PASSWORD: trendpulse
      POSTGRES_DB: trendpulse
    ports:
      - "5434:5432"
    volumes:
      - trendpulse_pgdata:/var/lib/postgresql/data

volumes:
  trendpulse_pgdata:
